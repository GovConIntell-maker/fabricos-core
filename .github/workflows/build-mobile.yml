name: FabricOS Mobile Deployment Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Modern Flutter Engine Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- SELF-HEALING SCAFFOLDING GENERATION ---
      - name: Inject Missing Native Android Scaffolding
        run: |
          rm -f pubspec.yaml
          flutter create --platforms=android --org com.sovereign.fabricos .

      # Re-inject our custom production dependencies
      - name: Apply FabricOS Dependency Matrix
        run: |
          flutter pub add sqlite3 sqflite_common_ffi dart_jsonwebtoken path_provider

      - name: Install System Dependencies
        run: flutter pub get

      - name: Compile Production Android App Bundle (.aab)
        run: flutter build appbundle --release

      - name: Archive Store-Ready Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabricos-android-deployment-bundle
          path: build/app/outputs/bundle/release/app-release.aab
