name: FabricOS Mobile Deployment Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Modern Flutter Engine Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- SELF-HEALING ARCHITECTURE ROUTINE ---
      - name: Inject Clean Native Android Scaffolding
        run: |
          rm -f pubspec.yaml
          flutter create --platforms=android --org com.sovereign.fabricos .

      # OVERWRITE THE GENERATED YAML DIRECTLY TO AVOID PARSING ERRORS
      # This forces your production dependency matrix to lock in flawlessly
      - name: Overwrite and Force Valid pubspec.yaml Structure
        run: |
          cat << 'EOF' > pubspec.yaml
          name: fabricos_mobile
          description: Sovereign Headless Multi-Agent Mobile Engine.
          version: 1.0.0+1
          environment:
            sdk: '>=3.2.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sqlite3: ^2.4.0
            sqlite3_flutter_libs: ^0.5.0
            sqflite_common_ffi: ^2.3.0
            dart_jsonwebtoken: ^2.4.2
            path_provider: ^2.1.3
          flutter:
            uses-material-design: true
          EOF

      - name: Clean Workspace Residual Cache
        run: flutter clean

      - name: Install System Dependencies
        run: flutter pub get

      # --- PRODUCTION BUILD EXECUTION ---
      - name: Compile Standalone Production Android Application Package (.apk)
        run: flutter build apk --release

      - name: Archive Store-Ready Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabricos-android-apk-package
          path: build/app/outputs/flutter-apk/app-release.apk
