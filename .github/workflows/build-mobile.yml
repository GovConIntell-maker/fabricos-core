name: FabricOS Mobile Deployment Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  build-android:
    runs-on: ubuntu-24.04 # <-- FIXED: Pins stable environment to prevent deprecation blocks
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5 # <-- FIXED: Upgraded to Node 24 baseline

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v5 # <-- FIXED: Upgraded to version 5 package standard
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Modern Flutter Engine Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # --- AUTOMATED NATIVE PROJECTS ASSEMBLY ---
      - name: Inject Missing Native Android Scaffolding
        run: |
          rm -f pubspec.yaml
          flutter create --platforms=android --org com.sovereign.fabricos .

      - name: Apply FabricOS Dependency Matrix
        run: |
          flutter pub add sqlite3 sqflite_common_ffi dart_jsonwebtoken path_provider

      - name: Install System Dependencies
        run: flutter pub get

      # --- DIRECT STANDALONE COMPILE ---
      - name: Compile Standalone Production Android Application Package (.apk)
        run: flutter build apk --release

      - name: Archive Store-Ready Android Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabricos-android-apk-package
          path: build/app/outputs/flutter-apk/app-release.apk
