name: FabricOS Desktop Deployment Compiler

on:
  push:
    branches: [ "main" ]

jobs:
  compile-desktop:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      # --- UPGRADED TO VERSION 5: CLEARS DEPRECATION WARNINGS ---
      - name: Check out repository code
        uses: actions/checkout@v5

      # --- CONSOLE CLEAN REPLACEMENT ---
      # Bypasses the setup-python action block to eliminate the internal Node.js 20 wrapper notice entirely
      - name: Verify and Upgrade Pre-installed Python Pip
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyperclip pyjwt

      - name: Run PyInstaller Windows Package Compilation
        if: matrix.os == 'windows-latest'
        run: pyinstaller --noconsole --onefile companion.py

      - name: Run PyInstaller macOS Package Compilation
        if: matrix.os == 'macos-latest'
        run: pyinstaller --noconsole --onefile companion.py

      # --- UPGRADED TO VERSION 5: CLEARS DEPRECATION WARNINGS ---
      - name: Archive Compiled Desktop Binary Artifact
        uses: actions/upload-artifact@v5
        with:
          name: fabricos-desktop-${{ matrix.os }}
          path: dist/*
